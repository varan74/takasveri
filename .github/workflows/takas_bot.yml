name: BIST 6 Aylık Takas Güncelleme

on:
  schedule:
    - cron: '30 15 * * 1-5' # UTC saatidir. TSİ 18:30'a denk gelir (Hafta içi)
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install pandas gspread google-auth undetected-chromedriver

      - name: Scripti Çalıştır
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python main.py
