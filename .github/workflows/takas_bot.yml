name: BIST 6 Aylık Takas Güncelleme

on:
  schedule:
    - cron: '30 22 * * *' 
  workflow_dispatch: 

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install pandas gspread google-auth undetected-chromedriver beautifulsoup4 lxml

      - name: Scripti Çalıştır
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python main.py
